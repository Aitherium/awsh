name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: install
        run: npm install
      - name: build
        run: npm run build --if-present
      - name: tests
        # Gated on shipped test FILES matching what runners actually execute:
        # awsh's mirror ships a test/ dir but not the *.test.ts files its own
        # `npm test` globs, so a bare directory gate still runs a command that
        # can only fail.
        if: ${{ hashFiles('test/**/*.test.*', 'tests/**/*.test.*') != '' }}
        run: npm test
