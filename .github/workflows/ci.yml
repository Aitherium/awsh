name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: install
        run: npm install
      - name: build
        run: npm run build --if-present
      - name: tests
        # Gated on shipped test FILES, not on the script existing: awsh's
        # mirror declares `npm test` but does not ship test/, so --if-present
        # alone runs a command that can only fail.
        if: ${{ hashFiles('test/**', 'tests/**') != '' }}
        run: npm test
